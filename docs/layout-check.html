<!doctype html>
<html lang="es"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión responsive · Aprende con Diego</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./manual.css"></head><body><main><h1>Revisión de diseño</h1><p>Herramienta de desarrollo: muestra la página real dentro de un viewport CSS acotado. No sustituye pruebas en un teléfono físico.</p><label for="layout-page">Página</label><select id="layout-page"><option value="index.html">Analizador</option><option value="academy.html">Academia</option><option value="visuals.html">Laboratorio visual</option><option value="learn.html">Taller</option><option value="guide.html">Guía</option><option value="demo.html">Demo</option></select><label for="layout-width">Ancho CSS</label><select id="layout-width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select><button id="layout-measure">Comprobar desbordamiento</button><p id="layout-result" role="status"></p><div class="viewport-shell"><div id="viewport-container" class="viewport-width-390"><iframe id="layout-frame" class="mobile-frame" title="Página en viewport de prueba" src="./index.html"></iframe></div></div></main><script type="module" src="./layout-check.js"></script><script type="module" src="./offline.js"></script></body></html>
